name: Animania Forge 1.20.1

on:
  # Development checkpoints are pushed frequently so players can test model
  # fixes.  Run this expensive full-release gate deliberately from Actions;
  # it should not send a failed-workflow email for every checkpoint push.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned upstream baselines (read-only)
        run: |
          mkdir -p upstream
          git clone --filter=blob:none --no-checkout https://github.com/capnkirok/animaniamod.git upstream/Animania-1.12
          git -C upstream/Animania-1.12 fetch --depth 1 origin 32ae2b4c56cb84284e865dae0d3b78770992ba1d
          git -C upstream/Animania-1.12 checkout --detach 32ae2b4c56cb84284e865dae0d3b78770992ba1d
          git clone --filter=blob:none --no-checkout https://github.com/capnkirok/animaniamod.git upstream/Animania-1.18
          git -C upstream/Animania-1.18 fetch --depth 1 origin 3b8909c5404d0bad8f3437562ca0c3924c0fa46d
          git -C upstream/Animania-1.18 checkout --detach 3b8909c5404d0bad8f3437562ca0c3924c0fa46d
          git -C upstream/Animania-1.12 rev-parse HEAD
          git -C upstream/Animania-1.18 rev-parse HEAD
      - name: Generate migration matrix
        run: python3 tools/build_migration_matrix.py --source upstream/Animania-1.12 --output docs/migration-matrix.json --reset-closure
      - name: Verify closure protocol tests
        run: python3 tools/test_closure_protocol.py
      - name: Validate schema-v2 matrix
        run: python3 tools/validate_matrix_schema.py --root .
      - name: Build, data-generate, and run Forge GameTests
        run: ./gradlew --no-daemon clean check runDataAll runGameTestsAll releaseBuild --max-workers=1
      - name: Run schema-v2 read-only audits and central closure
        shell: bash
        run: |
          set +e
          python3 tools/run_closure_audits.py --root . --matrix docs/migration-matrix.json --evidence-dir build/audit-evidence
          audit_status=$?
          python3 tools/verify_release_gates.py --root . --write
          gates_status=$?
          python3 tools/apply_verified_closure.py --root . --matrix docs/migration-matrix.json --evidence-dir build/audit-evidence
          apply_status=$?
          python3 tools/verify_closure.py --root . --matrix docs/migration-matrix.json --evidence-dir build/audit-evidence --check-only
          verify_status=$?
          set -e
          # A clean audit with external evidence absent is an expected,
          # non-release state.  Do not turn that state into a red CI build;
          # fail only when the auditors or the central writer report protocol
          # errors.  The next step asserts that release_allowed remains false.
          test "$audit_status" -eq 0 -a "$gates_status" -eq 2 -a "$apply_status" -eq 2 -a "$verify_status" -eq 1
      - name: Build and verify release gates (fail-closed audit)
        continue-on-error: true
        run: ./gradlew --no-daemon verifyRelease --max-workers=1
      - name: Assert non-release state is explicit
        run: |
          python3 - <<'PY'
          import json
          gates = json.load(open('build/release-gates.json', encoding='utf-8'))
          closure = json.load(open('build/migration-closure-report.json', encoding='utf-8'))
          if gates.get('all_passed'):
              raise SystemExit('release gates unexpectedly green without external runtime evidence')
          if closure.get('errors') or closure.get('error_count'):
              raise SystemExit('closure protocol errors are present')
          if closure.get('release_allowed'):
              raise SystemExit('release_allowed was set without all gates')
          print('Audit protocol is green; release remains explicitly blocked.')
          PY
      - name: Verify locale closure
        run: python3 tools/ensure_locales.py --root .
      - name: Audit release artifacts
        run: python3 tools/audit_release.py --root . --version 3.0.0
      - name: Audit startup dependency matrix
        run: python3 tools/audit_startup_matrix.py --root . --version 3.0.0
      - name: Audit resource closure
        run: python3 tools/audit_resources.py --root .
      - name: Audit ID mapping
        run: python3 tools/build_id_mapping.py --root . --output docs/id-mapping.json
