tasks.register('releaseGateAudit', Exec) {
    group = 'verification'
    description = 'Computes all whole-build stage-7 gates; missing external evidence stays false.'
    workingDir projectDir
    commandLine 'python', 'tools/verify_release_gates.py', '--root', projectDir.absolutePath, '--write'
}

tasks.named('releaseGateAudit') {
    mustRunAfter 'releaseArtifactAudit', 'startupMatrixAudit', 'resourceAudit', 'manualAudit', 'textureResolverAudit',
            'modelConversionAudit', 'apiContractAudit', 'configConverterRuntimeAudit', 'runDataAll', 'runGameTestsAll', ':base:check', ':farm:check', ':extra:check',
            ':catsdogs:check', ':config-migrator:check'
}
tasks.named('applyVerifiedClosure') {
    mustRunAfter 'releaseGateAudit'
}
