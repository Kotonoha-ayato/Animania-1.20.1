plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
}

allprojects {
    group = providers.gradleProperty('mod_group').get()
    version = providers.gradleProperty('mod_version').get()

    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://www.cursemaven.com' }
    }
}

tasks.register('releaseBuild') {
    group = 'build'
    description = 'Builds and reobfuscates all four independently publishable Animania modules and the config migrator.'
    // `jar` contains named development references.  A Forge installation must
    // receive the post-processed SRG bytecode from reobfJar; compiling alone
    // can otherwise produce a JAR that fails at mod construction with a
    // NoSuchMethodError/NoSuchFieldError.
    dependsOn ':base:build', ':farm:build', ':extra:build', ':catsdogs:build', ':config-migrator:build',
            ':base:reobfJar', ':farm:reobfJar', ':extra:reobfJar', ':catsdogs:reobfJar'
}

tasks.register('runDataAll') {
    group = 'verification'
    description = 'Runs Forge data generation for every Animania module.'
    dependsOn ':base:runData', ':farm:runData', ':extra:runData', ':catsdogs:runData'
}

tasks.register('runGameTestsAll') {
    group = 'verification'
    description = 'Runs the registered Forge GameTests for every Animania module.'
    dependsOn ':base:runGameTestServer', ':farm:runGameTestServer', ':extra:runGameTestServer', ':catsdogs:runGameTestServer'
}

// Each addon GameTest run loads Base's reobfuscated JAR. On Windows, running
// these Java processes in parallel races ForgeGradle's reobfJar replacement
// and produces a spurious "file in use" failure. Keep the release matrix
// deterministic and give each dedicated server exclusive access in turn.
project(':farm').tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    mustRunAfter ':base:runGameTestServer'
}
project(':extra').tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    mustRunAfter ':farm:runGameTestServer'
}
project(':catsdogs').tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    mustRunAfter ':extra:runGameTestServer'
}

tasks.register('verifyRelease') {
    group = 'verification'
    description = 'Runs the fail-closed seven-stage release gates. Schema-v2 closure is owned only by the central writer.'
    dependsOn ':base:check', ':farm:check', ':extra:check', ':catsdogs:check', ':config-migrator:check',
            'runDataAll', 'runGameTestsAll',
            'resourceAudit', 'manualAudit', 'textureResolverAudit', 'idMappingAudit', 'modelConversionAudit',
            'apiContractAudit', 'configConverterRuntimeAudit',
            'closureAudit', 'applyVerifiedClosure', 'migrationMatrixAudit',
            'releaseArtifactAudit', 'startupMatrixAudit', 'releaseGateAudit'
}

tasks.register('javaMigrationAudit', Exec) {
    group = 'verification'
    description = 'Revalidates source-derived Java type and simple breed migration evidence.'
    workingDir projectDir
    commandLine 'python', 'tools/audit_java_migration.py', '--root', projectDir.absolutePath,
            '--matrix', project.file('docs/migration-matrix.json').absolutePath
}

