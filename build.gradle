    workingDir projectDir
    commandLine 'python', 'tools/run_closure_audits.py', '--root', projectDir.absolutePath,
            '--matrix', project.file('docs/migration-matrix.json').absolutePath,
            '--evidence-dir', project.file('build/audit-evidence').absolutePath
}

tasks.register('applyVerifiedClosure', Exec) {
    group = 'verification'
    description = 'Applies only current, complete evidence through the central closure writer.'
    workingDir projectDir
    commandLine 'python', 'tools/apply_verified_closure.py', '--root', projectDir.absolutePath,
            '--matrix', project.file('docs/migration-matrix.json').absolutePath,
            '--evidence-dir', project.file('build/audit-evidence').absolutePath
}

tasks.named('applyVerifiedClosure') {
    mustRunAfter 'closureAudit'
}
tasks.named('migrationMatrixAudit') {
    mustRunAfter 'applyVerifiedClosure'
}

