    commandLine 'python', 'tools/audit_release.py', '--root', projectDir.absolutePath,
            '--version', project.version.toString(), '--matrix', project.file('docs/migration-matrix.json').absolutePath
}

tasks.register('startupMatrixAudit', Exec) {
    group = 'verification'
