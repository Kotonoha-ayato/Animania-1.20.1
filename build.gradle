    workingDir projectDir
    commandLine 'python', 'tools/audit_config_converter_runtime.py', '--root', projectDir.absolutePath,
            '--jar', project.file('config-migrator/build/libs/animania-config-migrator-3.0.0.jar').absolutePath,
            '--output', project.file('build/config-converter-audit.json').absolutePath
