apply plugin: 'java-library'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'maven-publish'

base {
    archivesName = project.archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.named('sourcesJar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('docs/credits.md')) { into 'META-INF' }
}

minecraft {
    mappings channel: rootProject.mapping_channel, version: rootProject.mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file("run/${name}")
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
                if (project.path != ':base') {
                    animania {
                        source project(':base').sourceSets.main
                    }
                }
            }
        }
        client { }
        server { args '--nogui' }
        gameTestServer { }
        data {
            workingDirectory project.file('run/data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Forge's dev GameTest launcher looks for fallback SNBT templates in the
// working-directory `gameteststructures` folder.  Keep the canonical template
// in source resources and copy it deterministically for every module's run.
tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    doLast {
        def source = project.file('src/main/resources/data/' + project.mod_id + '/gameteststructures/empty.snbt')
        if (!source.exists()) {
            source = rootProject.file('base/src/main/resources/data/animania/gameteststructures/empty.snbt')
        }
        def destination = project.file('run/gameTestServer/gameteststructures/empty.snbt')
        destination.parentFile.mkdirs()
        if (source.exists()) {
            destination.bytes = source.bytes
        }
        // A clean Forge GameTest run otherwise emits a misleading settings
        // error before the server starts.  Keep this generated file local to
        // the ignored run directory and never overwrite a user's settings.
        def serverProperties = project.file('run/gameTestServer/server.properties')
        // Use a versioned, module-specific level name so registry changes
        // never make a previous ignored GameTest world look like a failing
        // migration test.  This remains entirely inside the ignored run dir.
        def testWorldName = 'world_animania_' + project.mod_id + '_v4'
        def runRoot = project.file('run/gameTestServer').canonicalFile
        def testWorld = new File(runRoot, testWorldName).canonicalFile
        if (!testWorld.toPath().startsWith(runRoot.toPath())) {
            throw new GradleException("Refusing to clean GameTest world outside ${runRoot}")
        }
        // GameTest worlds are generated fixtures, never user saves. Recreate
        // the exact module-local target so registry changes cannot be hidden
        // behind missing-mapping recovery or a stale session lock.
        project.delete(testWorld)
        if (!serverProperties.exists() || !serverProperties.text.contains('level-name=' + testWorldName)) {
            serverProperties.parentFile.mkdirs()
            serverProperties.text = 'enable-command-block=true\nlevel-name=' + testWorldName + '\n'
        }
    }
}

// Forge's GameTest launcher can exit with code 0 after an early server-start
// failure, and "0 required tests passed" is not a test run.  Make both cases
// hard Gradle failures so CI cannot report a false green release gate.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def logFile = project.file('run/gameTestServer/logs/latest.log')
        if (!logFile.exists()) {
            throw new GradleException("GameTest produced no latest.log for ${project.path}")
        }
        def log = logFile.getText('UTF-8')
        if (log.contains('Failed to start the minecraft server')) {
            throw new GradleException("GameTest server failed to start for ${project.path}")
        }
        if (log.contains('Unidentified mapping from registry') || log.contains('detected missing registry entries')) {
            throw new GradleException("GameTest used a stale registry world for ${project.path}")
        }
        def passed = (log =~ /All\s+(\d+)\s+required tests passed/)
        if (!passed.find() || Integer.parseInt(passed.group(1)) == 0) {
            throw new GradleException("GameTest did not execute any required tests for ${project.path}")
        }
        if (log =~ /(?i)required tests failed|tests failed/) {
            throw new GradleException("GameTest reported failed tests for ${project.path}")
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The pinned 1.12 tree is kept read-only for migration evidence.  Its
    // nested assets/<addon>/animania namespace is not a runtime namespace in
    // 1.20.1; canonical assets and data are copied to the modern namespace
    // during normalization.  Excluding the legacy tree from the archive
    // prevents duplicate manual/sound/data resources from shadowing them.
    if (project.path != ':base') {
        exclude "assets/${project.name}/animania/**"
    }
    exclude "assets/${project.mod_id}/advancements/**"
    exclude "assets/${project.mod_id}/recipes/**"
    exclude "assets/${project.mod_id}/loot_tables/**"
    exclude "assets/${project.mod_id}/tags/**"
    def values = [
        minecraft_version_range: rootProject.minecraft_version_range,
        forge_version_range: rootProject.forge_version_range,
        loader_version_range: rootProject.loader_version_range,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_version: project.version,
        mod_description: project.mod_description,
        base_dependency: project.path == ':base' ? '' : """\n[[dependencies.${project.mod_id}]]\nmodId=\"animania\"\nmandatory=true\nversionRange=\"[3.0.0,4.0.0)\"\nordering=\"BEFORE\"\nside=\"BOTH\""""
    ]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = ''
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('docs/credits.md')) { into 'META-INF' }
    manifest.attributes([
        'Specification-Title': project.mod_id,
        'Specification-Vendor': 'Animania Team',
        'Specification-Version': '3',
        'Implementation-Title': project.mod_name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'Animania Team'
    ])
}

// Reobfuscation is a release/build product, not a prerequisite for mapped
// userdev runs. Finalizing every jar with reobfJar lets one GameTest server
// hold the Base JAR while another task tries to replace it on Windows.
tasks.named('build').configure { dependsOn 'reobfJar' }

// build/libs is a development artifact and can be recreated with Mojang-
// mapped symbols by later userdev/GameTest tasks. Release consumers must only
// receive the immutable output of ForgeGradle's reobfuscation task.
tasks.register('stageReleaseJar', Copy) {
    dependsOn 'reobfJar'
    from(layout.buildDirectory.file('reobfJar/output.jar'))
    into(layout.buildDirectory.dir('release'))
    rename { tasks.named('jar', Jar).get().archiveFileName.get() }
}

tasks.register('verifyProductionJar', Exec) {
    dependsOn 'stageReleaseJar'
    def releaseName = tasks.named('jar', Jar).flatMap { it.archiveFileName }
    def releaseJar = layout.buildDirectory.file(releaseName.map { "release/${it}" })
    inputs.file(releaseJar)
    commandLine 'python', rootProject.file('tools/audit_production_bytecode.py').absolutePath,
            '--jar', releaseJar.get().asFile.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    // Addons compile against Base's mapped development output.  The release
    // Base jar is finalized by reobfJar and must never win the unit-test
    // classpath, otherwise mapped Minecraft calls resolve to SRG names and
    // fail with NoSuchMethodError.  Keep the mapped output first explicitly.
    if (project.path != ':base') {
        dependsOn project(':base').tasks.named('classes')
        mustRunAfter project(':base').tasks.named('reobfJar')
        classpath = files(sourceSets.test.output.classesDirs, sourceSets.test.output.resourcesDir,
                project(':base').sourceSets.main.output,
                sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('animania-base-') })
    } else {
        classpath = files(sourceSets.test.output.classesDirs, sourceSets.test.output.resourcesDir,
                sourceSets.test.runtimeClasspath)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
